<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .container {
      background: rgba(30, 30, 30, 0.92);
      border-radius: 16px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      cursor: move;
    }
    .type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600;
    }
    .type-work { background: #fecaca; color: #b91c1c; }
    .type-short { background: #bbf7d0; color: #15803d; }
    .type-long { background: #bfdbfe; color: #1d4ed8; }
    .time {
      font-size: 28px;
      font-weight: 700;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      color: #fff;
      letter-spacing: 1px;
    }
    .task-name {
      font-size: 11px;
      color: #aaa;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container" id="draggable">
    <span id="badge" class="type-badge type-work">专注</span>
    <span id="time" class="time">25:00</span>
    <span id="task" class="task-name"></span>
  </div>
  <script>
    const badge = document.getElementById('badge');
    const timeEl = document.getElementById('time');
    const taskEl = document.getElementById('task');
    const container = document.getElementById('draggable');

    window.api.onFloatingUpdate((data) => {
      timeEl.textContent = data.time;
      if (data.type === 'work') {
        badge.textContent = '专注';
        badge.className = 'type-badge type-work';
      } else if (data.type === 'short_break') {
        badge.textContent = '短休';
        badge.className = 'type-badge type-short';
      } else {
        badge.textContent = '长休';
        badge.className = 'type-badge type-long';
      }
      taskEl.textContent = data.taskName || '';
    });

    // Drag functionality
    let isDragging = false;
    let startX, startY;

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.screenX;
      startY = e.screenY;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.screenX - startX;
      const deltaY = e.screenY - startY;
      window.api.moveFloatingWindow(deltaX, deltaY);
      startX = e.screenX;
      startY = e.screenY;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
